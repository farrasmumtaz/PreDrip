services:
  postgres:
    image: postgres:16-alpine
    container_name: predrip-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: predrip
    volumes:
      - predrip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predrip"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  predrip_postgres_data:
